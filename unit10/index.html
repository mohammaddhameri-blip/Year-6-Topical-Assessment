<script>
"use strict";
const KEY="y6-unit10-topical-preview-v3",DB="y6-unit10-topical-recordings";
const story=[
"On Tuesday afternoon, Mira and her brother Rohan were playing football in their garden. Mira kicked the ball towards some bushes. Rohan ran to get it, but the ball was gone.",
"It was not the first strange thing that week. Dad had lost a gardening glove, and Mum could not find her blue ribbon. Their dog, Jumbo, had been running around the garden all morning.",
"Rohan thought the neighbour might have taken the ball. Mira disagreed. A good detective looks for evidence before blaming anyone, she said. They borrowed Dad’s magnifying glass and searched near the bushes. Mira spotted a few short black hairs on the ground.",
"Jumbo has black hair. Perhaps he knows something, said Rohan. Just then, Jumbo raced past them and stopped near a tree. He scratched at a patch of soft soil. The children asked Dad to help them dig carefully.",
"Inside a shallow hole, they found the football, Dad’s glove and Mum’s ribbon. Jumbo had been hiding interesting things in his favourite place. Rohan laughed. He was our suspect, but he was only playing! Mira agreed that the clues had helped them solve the mystery. They put the objects away safely and gave Jumbo his own toys."

const readQs=[
["Where did the football disappear?",["Inside the house","Near some bushes","At the neighbour’s gate","Under a dining table"]],
["Which other two things were missing?",["A hat and a book","A key and a toy","A glove and a ribbon","A shoe and a phone"]],
["Why did Mira use a magnifying glass?",["To repair the ball","To look for clues","To measure the soil","To play a game"]],

["What happened just before the children found the missing things?",["Dad helped them dig","Mum called the police","The children fed Jumbo","Rohan bought another football"]],

const narration="Good morning. This is a report about the community park on Jalan Bunga. Last Saturday, the park caretaker, Mr Amir, found graffiti on a wall and two damaged benches near the playground. There was also broken glass beside the swings. He was disappointed because families use the park every day. The park had to close for safety checks and repairs. Mr Amir believes that some people damage public places because they do not understand how their actions affect others. A pupil named Nisha and her friends decided to help. On Sunday, they collected litter, made posters about looking after public property, and told a teacher about the damaged equipment. They did not touch the broken glass. The local council thanked the volunteers and promised to repair the benches. Mr Amir hopes everyone will work together to keep the park safe and clean.";

"What damage did Mr Amir find at the park? Name two examples.",
"Why did the community park have to close?",
"According to Mr Amir, why might some people damage public property?",
"What did Nisha and her friends do to improve the park? Give two examples."
];

"Why should children avoid the broken bench until it is repaired? Write one complete sentence.",

const dialogQs=[
["Mum calls Kent. What does she ask first?",["Is Dad home yet?","Where is the garden?","Did you buy milk?"]],
["Kent asks what happened. What should Mum say?",["I saw a mystery dog.","I accidentally locked my car keys inside.","I lost my football yesterday."]],
["Kent wants to help. What is a sensible question?",["Are you hungry?","Did you see a detective?","Is there a locksmith nearby?"]],
["Mum cannot find anyone to help. What does she ask?",["What should I do now?","What is your favourite game?","Can I walk the dog?"]]
];

["Kent","Explain what happened to Mum and her car."],
["Kate","Ask a useful question or offer an idea."],
["Kent","Respond to Kate and ask for more help."],
["Kate","Call Mum. Remind her about the spare car key in her purse."],
["Mum","Thank Kate and react to the solution."]
];

["Explain Your Opinion","Why is this person important to you? Give a reason and, if possible, an example.","Aim for 15–40 seconds.",50]

const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

const area=(kind,i,placeholder,rows)=>'<textarea class="field" rows="'+(rows||3)+'" data-kind="'+kind+'" data-index="'+i+'" placeholder="'+esc(placeholder)+'" aria-label="Answer '+(i+1)+'">'+esc(state[kind][i]||"")+'</textarea>';

function draw(){
 if(state.submitted){$("app").innerHTML=head("Assessment submitted on this device","Awaiting teacher review","Your work was saved only in this browser. It has NOT been uploaded or received by the school.")+'<div class="panel"><div class="badge">Testing version</div><h3>Your responses are stored locally.</h3><p class="notice">No scores, TP levels or CEFR results will appear. Teacher review and cloud submission will be available only after the secure assessment backend is added.</p><p>Test code: <strong>'+esc(state.code)+'</strong></p><button class="btn ghost" data-action="reset">Reset this pilot</button></div>';clock();return}
 if(state.page===0){$("app").innerHTML=head("Year 6 · Unit 10","It’s a Mystery.","An individual four-skills assessment inspired by the final unit of the Year 6 English textbook.")+'<div class="metric"><span>📖 Reading</span><span>🎧 Listening</span><span>✍️ Writing</span><span>🎙️ Speaking</span><span>20–30 minutes</span></div><div class="panel"><h3>Before you start</h3><ol><li>Find a quiet place and use headphones if possible.</li><li>Make sure your microphone works for the speaking tasks.</li><li>Your answers and recordings will be saved on this device.</li><li>This is a teacher-testing version, not an official attempt.</li></ol><label for="code"><strong>Tester code</strong> (format: TST-012)</label><input class="field" id="code" maxlength="7" autocomplete="off" value="'+esc(state.code)+'" placeholder="TST-012"><button class="btn" data-action="start">Start assessment →</button><p class="error" id="error"></p></div><div class="note">Testing only: there is no secure pupil login or online submission. Do not use this preview for official grading.</div>';clock();return}
 let output="";
 if(state.page===1){

 }
 if(state.page===2){
 output=head("02 / 04 · Listening","Who Damaged the Park?","Listen carefully. Then answer in your own words using complete sentences. The transcript is not shown during the listening assessment.")+steps()+'<div class="panel"><h3>Audio report</h3><div class="audio"><button class="btn" data-action="play">▶ Play narration</button><button class="btn ghost" data-action="stop-audio">■ Stop</button><label for="speed" class="small">Speed</label><select id="speed" class="field" style="width:96px;margin:0"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select><output id="audio-status">Original narration read aloud using your device speech engine.</output></div><p class="small">If the narration does not play, check your device’s text-to-speech and audio settings. You can adjust the playback speed.</p></div><div class="panel"><h3>Listening comprehension</h3>'+listenQs.map((q,i)=>'<div class="q"><strong>'+(i+1)+'. '+esc(q)+'</strong>'+area("listen",i,"Write a complete sentence.",3)+'</div>').join("")+control(1,3)+"</div>";
 }
 if(state.page===3){
 output=head("03 / 04 · Reading & Writing","Solve the Situation","Use the community notice to answer subjective questions and write a short dialogue.")+steps()+'<div class="panel"><h3>Community Notice</h3><div class="story"><p>'+esc(notice)+'</p></div>'+integratedQs.map((q,i)=>'<div class="q"><strong>'+(i+1)+'. '+esc(q)+'</strong>'+area("integrated",i,"Write complete sentences.",3)+'</div>').join("")+'</div><div class="panel"><h3>Choose the best response</h3><p class="small">Mum has accidentally locked her car keys inside her car. Help Kent and Kate work out what to do.</p>'+dialogQs.map((q,i)=>question(q[0],i,"dchoices",q[1])).join("")+'</div><div class="panel"><h3>Write the conversation</h3><p class="small">Finish the conversation in your own words. Use suitable questions, suggestions and full stops.</p>'+dialogue.map((pair,i)=>'<div class="q"><strong>'+esc(pair[0])+': '+esc(pair[1])+'</strong>'+area("dialogue",i,pair[0]+" says...",2)+'</div>').join("")+control(2,4)+"</div>";
 }
 if(state.page===4){
 output=head("04 / 04 · Speaking","Someone Special to Me","Use your microphone to answer each prompt individually. You can replay and rerecord before submission.")+steps()+'<div class="panel"><div class="speaking-intro"><strong>Describe your best friend, classmate or someone you love.</strong><p class="small" style="margin-bottom:0">Talk about personality, favourite activities, memories and why the person is special. You do not have to describe someone’s physical appearance.</p></div><div class="buttons"><button class="btn ghost" data-action="mic-test">Test microphone</button><span id="micstatus" class="small">Microphone permission is required.</span></div></div>'+speaking.map((p,i)=>'<div class="rec"><span class="eyebrow">Speaking '+(i+1)+' / 3</span><h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p><p class="small">'+esc(p[2])+'</p><div class="row"><button class="btn ghost" data-record="'+i+'" id="record'+i+'">● Record answer</button><span id="recordstatus'+i+'" class="small"></span></div><div id="clip'+i+'"></div></div>').join("")+'<div class="panel">'+control(3,5,"Review answers →")+"</div>";
 }
 if(state.page===5){
 const counts=[Object.keys(state.read).length,Object.values(state.listen).filter(x=>String(x).trim()).length,Object.values(state.integrated).filter(x=>String(x).trim()).length,Object.keys(state.dchoices).length,Object.values(state.dialogue).filter(x=>String(x).trim()).length,clips.filter(Boolean).length];
 output=head("Final step","Review Your Work","Check that every section is complete before saving your pilot attempt.")+steps()+'<div class="panel"><h3>Completion checklist</h3><div class="metric"><span>Reading: '+counts[0]+'/8</span><span>Listening: '+counts[1]+'/4</span><span>Notice answers: '+counts[2]+'/2</span><span>Dialogue MCQs: '+counts[3]+'/4</span><span>Dialogue lines: '+counts[4]+'/5</span><span>Voice recordings: '+counts[5]+'/3</span></div><div class="note">Submitting locks this attempt on this device, but it does NOT send it to the school. No official score is calculated in this pilot.</div><div class="buttons"><button class="btn ghost" data-go="4">← Back to speaking</button><button class="btn push" data-action="submit" '+(counts[5]===3?"":"disabled")+'>Submit test attempt →</button></div><p class="error" id="error"></p></div>';
 }
 $("app").innerHTML=output;clock();
 if(state.page===4)loadClipsToScreen();
}
function start(){const code=String($("code")?.value||"").trim().toUpperCase();if(!/^TST-\d{3}$/.test(code)){showError("Please enter a tester code such as TST-012. Official Y6-### codes will be enabled after backend integration.");return}if(state.started&&state.code&&state.code!==code){showError("This device already has a saved pilot. Reset it before using a different code.");return}state.code=code;state.started=state.started||Date.now();state.page=1;save();draw();window.scrollTo(0,0)}
function next(to){if(recording){showError("Stop the current recording first.");return}if(to===2&&readQs.some((_,i)=>state.read[i]===undefined)){showError("Answer all eight Reading questions first.");return}if(to===3&&listenQs.some((_,i)=>!String(state.listen[i]||"").trim())){showError("Answer all four Listening questions first.");return}if(to===4&&(integratedQs.some((_,i)=>!String(state.integrated[i]||"").trim())||dialogQs.some((_,i)=>state.dchoices[i]===undefined)||dialogue.some((_,i)=>!String(state.dialogue[i]||"").trim()))){showError("Complete the written answers and dialogue first.");return}if(to===5&&!clips.every(Boolean)){showError("Save all three speaking recordings before continuing.");return}stopNarration();state.page=to;save();draw();window.scrollTo(0,0)}
function stopNarration(){if("speechSynthesis" in window){speechSynthesis.cancel();utterance=null}}
function playNarration(){if(!("speechSynthesis" in window)){showError("Your browser does not support spoken narration.");return}stopNarration();utterance=new SpeechSynthesisUtterance(narration);utterance.lang="en-GB";utterance.rate=Number($("speed")?.value||1);utterance.onstart=()=>{if($("audio-status"))$("audio-status").textContent="Narration playing…"};utterance.onend=()=>{if($("audio-status"))$("audio-status").textContent="Narration finished."};utterance.onerror=()=>{if($("audio-status"))$("audio-status").textContent="Playback failed; check speech services on your device."};speechSynthesis.speak(utterance)}
function database(){return new Promise((res,rej)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{req.result.createObjectStore("clips")};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function clipGet(i){try{const db=await database();return await new Promise((res,rej)=>{const req=db.transaction("clips").objectStore("clips").get(state.code+"-"+i);req.onsuccess=()=>{db.close();res(req.result||null)};req.onerror=()=>{db.close();rej(req.error)}})}catch{return null}}
async function clipPut(i,blob){const db=await database();return new Promise((res,rej)=>{const tx=db.transaction("clips","readwrite");tx.objectStore("clips").put(blob,state.code+"-"+i);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)}})}
async function clipClear(code){try{const db=await database();await new Promise(res=>{const tx=db.transaction("clips","readwrite");for(let i=0;i<3;i++)tx.objectStore("clips").delete(code+"-"+i);tx.oncomplete=res;tx.onerror=res});db.close()}catch{}}
async function loadClipsToScreen(){urls.forEach(url=>URL.revokeObjectURL(url));urls=[];for(let i=0;i<3;i++){const holder=$("clip"+i);if(!holder)continue;const blob=await clipGet(i);clips[i]=Boolean(blob);if(blob&&holder.isConnected){const url=URL.createObjectURL(blob);urls.push(url);holder.innerHTML='<div class="good small">✓ Recording saved on this device</div><audio controls preload="metadata" src="'+url+'"></audio>'}}}
async function micTest(){const label=$("micstatus");if(!navigator.mediaDevices?.getUserMedia){label.textContent="Use HTTPS and a browser that supports microphone recording.";return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());label.textContent="✓ Microphone available.";label.className="good small"}catch(e){label.textContent="Microphone unavailable: "+e.message}}
async function toggleRecording(i){if(recording){if(i===recIndex)recording.stop();else showError("Stop the current clip first.");return}if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"){showError("This browser cannot record audio. Use a current browser over HTTPS.");return}try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});const candidates=["audio/webm;codecs=opus","audio/mp4","audio/webm"];const mime=candidates.find(type=>MediaRecorder.isTypeSupported(type));const chunks=[];recording=new MediaRecorder(mediaStream,mime?{mimeType:mime}:undefined);recIndex=i;const r=recording,button=$("record"+i),status=$("recordstatus"+i),started=Date.now();button.textContent="■ Stop recording";button.className="btn warn";r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};r.onstop=async()=>{clearInterval(recInterval);mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;recording=null;recIndex=-1;const blob=new Blob(chunks,{type:r.mimeType||mime||"audio/webm"});if(blob.size){try{await clipPut(i,blob);clips[i]=true;status.textContent="✓ Recording saved";await loadClipsToScreen()}catch(e){status.textContent="Saving failed. Check device storage."}}else status.textContent="Recording empty. Try again.";button.textContent="● Rerecord";button.className="btn ghost"};r.start(250);recInterval=setInterval(()=>{const elapsed=Math.floor((Date.now()-started)/1000);if(status)status.textContent="Recording: "+elapsed+" seconds";if(elapsed>=speaking[i][3]&&r.state==="recording")r.stop()},500)}catch(e){mediaStream?.getTracks().forEach(t=>t.stop());recording=null;showError("Unable to record: "+e.message)}}
async function submit(){if(!clips.every(Boolean)){showError("Record all three speaking responses first.");return}if(!confirm("Save and lock this LOCAL pilot attempt? It will NOT be sent to a teacher."))return;stopNarration();state.submitted=true;save();draw();window.scrollTo(0,0)}
async function reset(){if(!confirm("Delete all saved written answers and microphone recordings from this device?"))return;stopNarration();await clipClear(state.code);state=blank();clips=[false,false,false];save();draw();window.scrollTo(0,0)}
$("app").addEventListener("click",e=>{const button=e.target.closest("button");if(!button)return;if(button.dataset.go!==undefined)next(Number(button.dataset.go));else if(button.dataset.record!==undefined)toggleRecording(Number(button.dataset.record));else if(button.dataset.action==="start")start();else if(button.dataset.action==="play")playNarration();else if(button.dataset.action==="stop-audio")stopNarration();else if(button.dataset.action==="mic-test")micTest();else if(button.dataset.action==="submit")submit();else if(button.dataset.action==="reset")reset()});
$("app").addEventListener("change",e=>{const n=e.target;if(n.type==="radio"){const match=n.name.match(/^(read|dchoices)(\d+)$/);if(match){state[match[1]][Number(match[2])]=Number(n.value);save()}}});
$("app").addEventListener("input",e=>{const n=e.target;if(n.dataset.kind){state[n.dataset.kind][Number(n.dataset.index)]=n.value;save()}});
(async()=>{if(state.code){clips=await Promise.all([0,1,2].map(async i=>Boolean(await clipGet(i))));if(state.page===5&&!state.submitted)draw()}})();
window.addEventListener("pagehide",()=>{stopNarration();if(recording?.state==="recording")recording.stop()});
draw();
</script></body></html>
